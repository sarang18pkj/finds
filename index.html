<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b62">
<title>Finds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column — filters, one button, then 10 product cards (cover + price + link + steps) */
:root{
  --bg:#f6f8f7; --surface:#ffffff; --fg:#14211f; --muted:#5b6b68; --line:#dbe3e1;
  --accent:#0d6b62; --accent-fg:#ffffff; --marigold:#f2a516; --marigold-soft:#fdf0d4;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Mukta", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1716; --surface:#172220; --fg:#e6efed; --muted:#9db0ac; --line:#2a3a37;
  --accent:#3fb3a5; --accent-fg:#06201d; --marigold:#f5b740; --marigold-soft:#3a2f17; color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h1{font:800 1.9rem/1 var(--display);margin:0}
h1 b{color:var(--marigold)}
.controls{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.label{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;width:100%}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 .95rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.go{border:0;background:var(--marigold);color:#2a1d00;font:800 1.25rem var(--display);border-radius:14px;padding:14px;cursor:pointer;width:100%}
button:focus-visible,a:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.status{margin:0;color:var(--muted);font-size:.95rem;min-height:1.4em}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:110px 1fr;gap:12px;min-width:0}
.cover{display:grid;gap:6px;align-content:start}
.cover canvas{width:110px;aspect-ratio:9/16;border-radius:10px;background:var(--line);display:block}
.cover button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:8px;padding:4px;font:500 .8rem var(--body);cursor:pointer}
.info{display:grid;gap:6px;align-content:start;min-width:0}
.rank{font:700 .78rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.name{font:700 1.1rem/1.2 var(--display);margin:0}
.buy{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:8px 12px}
.buy b{font:800 1.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.buy span{font-weight:700;font-size:.95rem}
.others{display:flex;flex-wrap:wrap;gap:6px;font-size:.88rem}
.others a{color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;text-decoration:none;font-variant-numeric:tabular-nums}
.steps{grid-column:1/-1;margin:0;padding:10px 12px 10px 30px;background:var(--marigold-soft);border-radius:12px;font-size:.95rem}
.steps::before{content:"Video kaise banayein";display:block;margin-left:-18px;font-weight:700}
@media (max-width:360px){.card{grid-template-columns:90px 1fr}.cover canvas{width:90px}}
</style>
</head>
<body>
<div class="wrap">
  <h1><b>Top 10</b> Finds</h1>

  <div class="controls">
    <div class="row" id="budget"><span class="label">Budget</span>
      <button class="chip" data-v="1000">₹1000 se kam</button>
      <button class="chip" data-v="500">₹500 se kam</button>
      <button class="chip" data-v="200">₹200 se kam</button>
      <button class="chip" data-v="100">₹100 se kam</button>
    </div>
    <div class="row" id="plats"><span class="label">Kahan se (ek ya zyada)</span>
      <button class="chip" data-v="Amazon">Amazon</button>
      <button class="chip" data-v="Meesho">Meesho</button>
      <button class="chip" data-v="Flipkart">Flipkart</button>
      <button class="chip" data-v="Blinkit">Blinkit</button>
      <button class="chip" data-v="Instamart">Instamart</button>
      <button class="chip" data-v="Zepto">Zepto</button>
    </div>
    <div class="row" id="cats"><span class="label">Category</span>
      <button class="chip" data-v="">Sab</button>
      <button class="chip" data-v="Kitchen">Kitchen</button>
      <button class="chip" data-v="Home decor & organisers">Ghar</button>
      <button class="chip" data-v="Beauty & skincare">Beauty</button>
      <button class="chip" data-v="Fashion & jewellery">Fashion & Jewellery</button>
      <button class="chip" data-v="Gadgets & phone accessories">Gadgets</button>
      <button class="chip" data-v="Kids & toys">Bachche</button>
      <button class="chip" data-v="Gifting & festive">Gifting & Tyohaar</button>
    </div>
    <button class="go" id="go">Top 10 dikhao</button>
    <p class="status" id="status">Filter chuno aur button dabao.</p>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
const API="https://finds-api.sarangfinds.workers.dev";
const SEARCH={
  Amazon:q=>`https://www.amazon.in/s?k=${q}`, Meesho:q=>`https://www.meesho.com/search?q=${q}`,
  Flipkart:q=>`https://www.flipkart.com/search?q=${q}`, Blinkit:q=>`https://blinkit.com/s/?q=${q}`,
  Instamart:q=>`https://www.swiggy.com/instamart/search?query=${q}`, Zepto:q=>`https://www.zeptonow.com/search?query=${q}`};
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+Math.round(n).toLocaleString("en-IN");

// Filters: budget and category pick one, platforms pick many; all remembered on this phone
const f=store.get("filters",{budget:"500",cat:"",plats:Object.keys(SEARCH)});
function paint(){
  for(const c of document.querySelectorAll("#budget .chip"))c.setAttribute("aria-pressed",c.dataset.v===f.budget);
  for(const c of document.querySelectorAll("#cats .chip"))c.setAttribute("aria-pressed",c.dataset.v===f.cat);
  for(const c of document.querySelectorAll("#plats .chip"))c.setAttribute("aria-pressed",f.plats.includes(c.dataset.v));
  store.set("filters",f);
}
document.querySelector(".controls").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(!c)return;
  const row=c.parentElement.id,v=c.dataset.v;
  if(row==="budget")f.budget=v;
  else if(row==="cats")f.cat=v;
  else f.plats=f.plats.includes(v)?(f.plats.length>1?f.plats.filter(p=>p!==v):f.plats):[...f.plats,v];
  paint();
});
paint();

let seen=store.get("seen",[]),data=store.get("result",null);

function render(){
  if(!data){$("#list").innerHTML="";return}
  const quick=data.platforms.filter(p=>["Blinkit","Instamart","Zepto"].includes(p));
  $("#list").innerHTML=data.items.map((it,i)=>{
    const [best,...rest]=it.offers, q=encodeURIComponent(it.search);
    const searchFor=ps=>ps.map(p=>`<a href="${SEARCH[p](q)}" target="_blank" rel="noopener">${p} pe dhoondho</a>`).join("");
    const others=rest.map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${o.platform} ${money(o.price)}</a>`).join("")
      +searchFor(quick.filter(p=>!it.offers.some(o=>o.platform===p)));
    return `<article class="card">
      <div class="cover"><canvas id="cv${i}" width="720" height="1280" aria-label="Shorts cover for ${esc(it.name)}"></canvas>
        <button data-dl="${i}">Cover save karo</button></div>
      <div class="info">
        <span class="rank">#${i+1}</span>
        <p class="name">${esc(it.name)}</p>
        ${best?`<a class="buy" href="${esc(best.url)}" target="_blank" rel="noopener"><b>${money(best.price)}</b><span>${best.platform} pe dekho →</span></a>`
              :`<div class="others">${searchFor(data.platforms)}</div>`}
        ${best&&others?`<div class="others">${others}</div>`:""}
      </div>
      <ol class="steps">${it.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    </article>`}).join("");
  document.fonts.ready.then(()=>data.items.forEach((it,i)=>drawCover($("#cv"+i),it)));
}

// 9:16 Shorts cover: product photo, big hook words, price badge
function wrapLines(ctx,text,max){const out=[];let line="";for(const w of text.split(/\s+/)){const t=line?line+" "+w:w;if(ctx.measureText(t).width>max&&line){out.push(line);line=w}else line=t}if(line)out.push(line);return out}
function drawCover(cv,it){
  const ctx=cv.getContext("2d"),W=720,H=1280,price=it.offers[0]?.price;
  const finish=img=>{
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,H);
    if(img){const s=Math.min(W/img.width,(H*0.62)/img.height),w=img.width*s,h=img.height*s;ctx.drawImage(img,(W-w)/2,60+(H*0.62-h)/2,w,h)}
    ctx.fillStyle="#0d6b62";ctx.fillRect(0,H*0.66,W,H*0.34);
    ctx.fillStyle="#ffffff";ctx.textAlign="center";ctx.textBaseline="middle";
    let size=120,lines;
    do{ctx.font=`800 ${size}px "Baloo 2", sans-serif`;lines=wrapLines(ctx,it.thumb.toUpperCase(),W-80);size-=6}while((lines.length>3||lines.some(l=>ctx.measureText(l).width>W-80))&&size>48);
    const lh=size*1.05,y0=H*0.83-(lines.length-1)*lh/2;
    lines.forEach((l,k)=>ctx.fillText(l,W/2,y0+k*lh));
    if(price){ctx.fillStyle="#f2a516";ctx.beginPath();ctx.arc(W-130,H*0.66,110,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#2a1d00";ctx.font='800 72px "Baloo 2", sans-serif';ctx.fillText(money(price),W-130,H*0.66+4)}
  };
  if(!it.image)return finish(null);
  const img=new Image();img.crossOrigin="anonymous";
  img.onload=()=>finish(img);img.onerror=()=>finish(null);
  img.src=API+"/img?u="+encodeURIComponent(it.image);
}
$("#list").addEventListener("click",e=>{
  const b=e.target.closest("[data-dl]");if(!b)return;
  const it=data.items[b.dataset.dl];
  $("#cv"+b.dataset.dl).toBlob(blob=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=it.name.replace(/[^\w ]+/g,"").trim().replace(/\s+/g,"-")+"-cover.jpg";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  },"image/jpeg",0.9);
});

const go=$("#go"),status=$("#status");
const ERR={rate_limited:"Aaj ki limit poori ho gayi. Thodi der baad dobara dabao.",bad_reply:"List theek se nahi aayi. Ek baar aur dabao."};
let ctl=null;
go.onclick=async()=>{
  if(ctl){ctl.abort();return}
  ctl=new AbortController();
  go.textContent="Ruko (cancel)";status.textContent="Trend aur sabse sasta price dhoondh rahi hoon… 20–40 second.";
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
      body:JSON.stringify({budget:+f.budget,cat:f.cat,platforms:f.plats,seen:seen.slice(-60)})});
    const res=await r.json().catch(()=>({error:"bad_reply"}));
    if(!res.items||!res.items.length) throw {code:res.error||"bad_reply"};
    data=res;store.set("result",data);
    seen=[...seen,...res.items.map(x=>x.name)].slice(-120);store.set("seen",seen);
    render();status.textContent="Ye rahe top 10. Price tap karke product kholo.";
  }catch(e){
    status.textContent=e.name==="AbortError"?"":(ERR[e.code]||"Internet check karo aur ek baar aur dabao.");
  }finally{ctl=null;go.textContent="Top 10 dikhao"}
};
render();
</script>
</body>
</html>
